<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Bank</title>
    <link rel="stylesheet" href="Bank style.css">
</head>

<body>

    <div class="app-card">
        <!-- Header -->
        <div class="header">
            <span class="brand-badge">Official App</span>
            <h1>Great Bank</h1>
            <p>Welcome back, Alex</p>

            <div class="balance-card">
                <span>Available Balance</span>
                <div class="balance-amount" id="balance">$2,450.00</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">

            <!-- Quick Action Form -->
            <div class="input-group">
                <label for="amount">Enter Amount</label>
                <div class="input-wrapper">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="amount" placeholder="0.00" min="1" step="any">
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-deposit" onclick="handleDeposit()">Deposit</button>
                <button class="btn btn-withdraw" onclick="handleWithdraw()">Pay / Send</button>
            </div>

            <!-- Activity Section -->
            <div class="section-title">Recent Activity</div>
            <ul class="transactions" id="transaction-list">
                <li class="transaction-item">
                    <div class="transaction-info">
                        <span class="transaction-title">Initial Deposit</span>
                        <span class="transaction-date">Today</span>
                    </div>
                    <span class="amount-plus">+$2,450.00</span>
                </li>
            </ul>

        </div>
    </div>
<script src="bank script.js"></script>
</body>

</html>
